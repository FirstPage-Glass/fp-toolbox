<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Workspace — FirstPage HK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.99 0 0);
  --surface:oklch(0.965 0 0);
  --fg:oklch(0.24 0.09 266);
  --muted:oklch(0.50 0 0);
  --border:oklch(0.91 0 0);
  --accent:oklch(0.69 0.20 24);
  --blue:oklch(0.62 0.16 250);
  --blue-600:oklch(0.50 0.14 254);
  --navy:oklch(0.24 0.09 266);
  --green:oklch(0.55 0.14 152);
  --amber:oklch(0.72 0.15 75);
  --rose:oklch(0.62 0.20 22);
  --grad-cta:linear-gradient(224deg,oklch(0.62 0.19 22) 0%,oklch(0.69 0.20 24) 100%);
  --grad-banner:linear-gradient(225deg,oklch(0.60 0.17 250) 0%,oklch(0.44 0.12 256) 100%);
  --font-display:"proxima-nova","Open Sans","Segoe UI",system-ui,sans-serif;
  --font-body:"proxima-nova","Open Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"SFMono-Regular",ui-monospace,Menlo,monospace;
  --shadow-sm:0 1px 2px oklch(0.2 0.05 266 / 0.06),0 1px 3px oklch(0.2 0.05 266 / 0.08);
  --shadow-md:0 4px 12px oklch(0.2 0.05 266 / 0.10),0 2px 4px oklch(0.2 0.05 266 / 0.06);
  --radius:14px;
  --cat-sales:oklch(0.69 0.20 24);
  --cat-research:oklch(0.62 0.16 250);
  --cat-technical:oklch(0.44 0.12 256);
  --cat-content:oklch(0.72 0.15 75);
  --cat-ops:oklch(0.55 0.14 152);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--surface);color:var(--fg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue-600);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-0.01em;line-height:1.15;color:var(--navy)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.topbar{background:var(--navy);color:#fff;font-size:12px;letter-spacing:0.02em}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:7px;padding-bottom:7px}
.topbar .regions{display:flex;gap:14px;opacity:.7}
.topbar a{color:#fff}
header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
header.nav .wrap{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-display)}
.brand .mark{width:36px;height:36px;border-radius:9px;background:var(--grad-banner);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.08em}
.brand .name{font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--navy);line-height:1.1}
.brand .sub{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--blue-600)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--navy)}
nav.main a:hover{background:var(--surface);text-decoration:none}
nav.main a.on{background:oklch(0.62 0.16 250 / 0.10);color:var(--blue-600)}
nav.main a.cta{background:var(--grad-cta);color:#fff}
nav.main a.cta:hover{filter:brightness(1.05)}
/* page head */
.pagehead{background:var(--grad-banner);color:#fff;padding:30px 0 32px}
.pagehead .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ph-tile{width:52px;height:52px;border-radius:13px;background:oklch(1 0 0 / 0.14);border:1px solid oklch(1 0 0 / 0.25);display:grid;place-items:center;color:#fff;flex-shrink:0}
.ph-tile svg{width:26px;height:26px;stroke:currentColor}
.pagehead h1{color:#fff;font-size:clamp(22px,2.8vw,30px);font-weight:800;letter-spacing:-0.015em}
.pagehead .sub{color:oklch(0.93 0.02 250);font-size:13.5px;margin-top:3px;max-width:62ch}
.ph-meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ph-meta .chip{background:oklch(1 0 0 / 0.14);border:1px solid oklch(1 0 0 / 0.22);color:#fff;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.04em}
/* layout */
main{max-width:1200px;margin:0 auto;padding:28px 24px 64px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:84px}
/* form card */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card .hd{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border)}
.card .hd h3{font-size:15px;font-weight:800}
.card .hd .tag{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.card .bd{padding:20px}
.tag.sales{background:oklch(0.69 0.20 24 / 0.10);color:var(--cat-sales)}
.tag.research{background:oklch(0.62 0.16 250 / 0.10);color:var(--blue-600)}
.tag.technical{background:oklch(0.44 0.12 256 / 0.10);color:var(--cat-technical)}
.tag.content{background:oklch(0.72 0.15 75 / 0.14);color:oklch(0.5 0.13 75)}
.tag.ops{background:oklch(0.55 0.14 152 / 0.12);color:oklch(0.42 0.13 152)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.field label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--navy);margin-bottom:6px}
.field label .req{color:var(--accent)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-family:var(--font-body);font-size:14px;color:var(--fg);background:var(--bg);transition:border-color .12s,box-shadow .12s}
.field textarea{resize:vertical;min-height:84px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px oklch(0.62 0.16 250 / 0.15)}
.field .help{font-size:11.5px;color:var(--muted);margin-top:5px}
.form-actions{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:14.5px;letter-spacing:.02em;border-radius:10px;padding:12px 24px;border:1px solid transparent;cursor:pointer;min-height:46px;transition:transform .12s,filter .12s;background:var(--grad-cta);color:#fff;box-shadow:0 5px 14px oklch(0.62 0.19 22 / 0.3)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;border-color:var(--border);color:var(--navy);box-shadow:none}
.btn.sec:hover{border-color:var(--blue);color:var(--blue-600)}
.counter{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
.counter b{color:var(--blue-600)}
/* refine */
.refine{display:flex;gap:10px;margin-top:14px}
.refine input{flex:1;border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:13.5px;font-family:var(--font-body)}
.refine input:focus{outline:none;border-color:var(--blue)}
/* links out */
.outlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.outlinks .l{font-size:12.5px;font-weight:700;color:var(--blue-600);background:oklch(0.62 0.16 250 / 0.08);border:1px solid oklch(0.62 0.16 250 / 0.25);padding:6px 12px;border-radius:999px}
.outlinks .l:hover{background:oklch(0.62 0.16 250 / 0.16);text-decoration:none}
/* result */
#result{display:none}
#result.show{display:block}
.res-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.res-head h3{font-size:15.5px;font-weight:800}
.res-head .ok{margin-left:auto;font-size:11.5px;font-weight:800;color:oklch(0.42 0.13 152);background:oklch(0.55 0.14 152 / 0.12);padding:5px 12px;border-radius:999px;letter-spacing:.05em}
.res-head .cost{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.rstat{background:oklch(0.965 0 0 / 0.7);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
.rstat .l{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rstat .v{font-family:var(--font-display);font-size:21px;font-weight:800;color:var(--navy);margin-top:5px;letter-spacing:-0.01em}
.rstat .s{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1.5px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
td b{color:var(--navy)}
.slides{display:flex;flex-direction:column;gap:12px}
.slide{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.slide .sh{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--grad-banner);color:#fff;font-weight:800;font-size:13.5px}
.slide .sb{padding:16px}
.slide .sb h4{font-size:15px;font-weight:800;margin-bottom:8px}
.slide .sb ul{margin:0;padding-left:20px}
.slide .sb li{font-size:13.5px;padding:2.5px 0;color:#444}
.secblock{margin-bottom:16px}
.secblock h4{font-size:14.5px;font-weight:800;margin-bottom:8px;color:var(--navy)}
.secblock p{font-size:13.5px;color:#444;line-height:1.6;margin-bottom:8px}
.secblock ul{margin:0;padding-left:20px}
.secblock li{font-size:13.5px;color:#444;padding:2px 0}
pre.code{background:var(--navy);color:oklch(0.92 0.02 250);border-radius:11px;padding:16px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;overflow-x:auto;white-space:pre-wrap}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.score{margin-bottom:10px}
.score .ttl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
.score .ttl .v{font-family:var(--font-mono)}
.score .tr{height:9px;background:var(--surface);border-radius:5px;overflow:hidden}
.score .fl{height:100%;border-radius:5px}
.note-bar{font-size:12.5px;color:var(--muted);background:oklch(0.965 0 0 / .7);border:1px dashed var(--border);border-radius:10px;padding:10px 14px;margin-top:14px}
/* history */
.history li{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.history li:hover{background:oklch(0.62 0.16 250 / 0.05)}
.history li:last-child{border-bottom:0}
.history .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0}
.history .who{flex:1;min-width:0}
.history .who b{display:block;font-size:13px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history .who span{font-size:11.5px;color:var(--muted)}
.history .cost{font-size:11.5px;font-family:var(--font-mono);color:var(--muted);flex-shrink:0}
.empty-rail{font-size:13px;color:var(--muted);padding:14px 16px;line-height:1.5}
/* hubspot rail */
.lead-row{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.lead-row:last-child{border-bottom:0}
.lead-row .av{width:32px;height:32px;border-radius:50%;background:var(--grad-banner);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0}
.lead-row .info{flex:1;min-width:0}
.lead-row .info b{display:block;font-size:13px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-row .info span{font-size:11.5px;color:var(--muted)}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:999px;flex-shrink:0}
.badge.hot{background:oklch(0.55 0.14 152 / 0.15);color:oklch(0.42 0.13 152)}
.badge.warm{background:oklch(0.72 0.15 75 / 0.2);color:oklch(0.5 0.13 75)}
.badge.cold{background:oklch(0.62 0.20 22 / 0.1);color:var(--rose)}
.importbtn{width:100%;border:1.5px dashed var(--blue);color:var(--blue-600);background:oklch(0.62 0.16 250 / 0.05);border-radius:10px;padding:11px;font-family:var(--font-display);font-weight:700;font-size:13px;cursor:pointer;margin-top:6px}
.importbtn:hover{background:oklch(0.62 0.16 250 / 0.12)}
footer{background:var(--navy);color:oklch(0.85 0.02 250);padding:28px 0;font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer strong{color:#fff}
@media(max-width:960px){
  main{grid-template-columns:1fr}
  .rail{position:static}
}
@media(max-width:640px){
  .topbar .regions{display:none}
  nav.main a{padding:7px 9px;font-size:12.5px}
  nav.main a:nth-child(n+5){display:none}
  header.nav .wrap{gap:10px}
  .brand .sub{display:none}
  .fgrid{grid-template-columns:1fr}
  .ph-meta{margin-left:0}
}
</style>
</head>

    <div class="card" id="result" data-od-id="tool-result">

        <span class="ok" id="res-ok">Generated</span>
        <span class="cost" id="res-cost"></span>
      </div>
      <div class="bd" id="res-body"></div>
    </div>
  </div>

  <aside class="rail" data-od-id="tool-rail">
    <div class="card" data-od-id="rail-hubspot">
      <div class="hd"><h3>Recent leads</h3><span class="tag sales" style="margin-left:auto">HubSpot · 7d</span></div>
      <div id="lead-list"></div>
      <div class="bd" style="padding-top:8px"><button class="importbtn" id="import-btn">Import from HubSpot</button></div>
    </div>
    <div class="card" data-od-id="rail-history">
      <div class="hd"><h3>Previous outputs</h3><span class="tag technical" style="margin-left:auto">history</span></div>
      <ul class="history" id="history"></ul>
    </div>
  </aside>
</main>

"FAQ Schema Generator":'<path d="M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.7v.5"/><circle cx="12" cy="18" r=".5"/><rect x="3" y="3" width="18" height="18" rx="2"/>'
};
const CATCOLOR={Sales:'var(--cat-sales)',"SEO Research":'var(--cat-research)',"SEO Technical":'var(--cat-technical)',Content:'var(--cat-content)',Operations:'var(--cat-ops)'};
const CATBG={Sales:'oklch(0.69 0.20 24 / 0.10)',"SEO Research":'oklch(0.62 0.16 250 / 0.10)',"SEO Technical":'oklch(0.44 0.12 256 / 0.10)',Content:'oklch(0.72 0.15 75 / 0.14)',Operations:'oklch(0.55 0.14 152 / 0.12)'};
const CATLBL={Sales:"Sales",SEO_Research:"SEO Research",SEO_Technical:"SEO Technical",Content:"Content",Operations:"Operations"};
/* ---------- state ---------- */
const params=new URLSearchParams(location.search);
let slug=params.get('slug')||'meeting-prep';
let tool=TOOLS[slug]||TOOLS['meeting-prep'];
let historyCount=0;
/* ---------- render head ---------- */
const ph=document.getElementById('ph');
ph.querySelector('.wrap')?.remove();
const head=document.createElement('div');head.className='wrap';
head.innerHTML=`
  <span class="ph-tile" style="color:${CATCOLOR[tool.cat]}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[tool.name]||ICONS["Tool Usage Stats"]}</svg></span>
  <div>
    <h1>${tool.name}</h1>
    <div class="sub">${tool.desc}</div>
  </div>
  <div class="ph-meta">
    <span class="chip">${tool.cat}</span>
    <span class="chip">${tool.owner}</span>
    ${tool.kind==='llm'?'<span class="chip">LLM · refine</span>':tool.kind==='external'?'<span class="chip">External</span>':'<span class="chip">Live data</span>'}
  </div>`;
ph.appendChild(head);
/* ---------- render fields ---------- */
const fieldsEl=document.getElementById('fields');
const tagEl=document.getElementById('form-tag');
const titleEl=document.getElementById('form-title');
tagEl.textContent=tool.cat;tagEl.className='tag '+CATS[tool.cat.replace(' ','_')];
titleEl.textContent=`${tool.name} — inputs`;
function fieldHTML(f){
  if(f.type==='select'){
    return `<div class="field ${f.full?'full':''}"><label for="f-${f.id}">${f.label}${f.req?' <span class="req">*</span>':''}</label>
      <select id="f-${f.id}">${f.opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
  }
  if(f.type==='number'){
    return `<div class="field ${f.full?'full':''}"><label for="f-${f.id}">${f.label}</label>
      <input id="f-${f.id}" type="number" value="${f.def!==undefined?f.def:''}" placeholder="${f.ph||''}"></div>`;
  }
  const tag=f.full?'textarea':'input';
  const extra=f.list?` list="sites-${f.id}"`:'';
  const datalist=f.list?`<datalist id="sites-${f.id}">${f.list.map(s=>`<option value="${s}">`).join('')}</datalist>`:'';
  return `<div class="field ${f.full?'full':''}"><label for="f-${f.id}">${f.label}${f.req?' <span class="req">*</span>':''}</label>
    <${tag} id="f-${f.id}" ${tag==='input'?`type="text" ${extra}`:''} placeholder="${f.ph||''}"></${tag}>${datalist}</div>`;
}
if(tool.external){
  fieldsEl.innerHTML=`<div class="field full"><p style="font-size:14px;color:var(--muted);line-height:1.6">This tool is hosted externally. Click below to open the standalone generator in a new tab.</p></div>`;
  document.getElementById('gen-btn').textContent='Open external tool ↗';
}else{
  fieldsEl.innerHTML=tool.fields.map(fieldHTML).join('');
}
const outlinks=document.getElementById('outlinks');
if(tool.links&&tool.links.length){
  outlinks.innerHTML='<span style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;align-self:center">Send to →</span>'+
    tool.links.map(s=>TOOLS[s]?`<a class="l" href="tools.html?slug=${s}">${TOOLS[s].name}</a>`:'').join('');
}
/* ---------- actions ---------- */
const genBtn=document.getElementById('gen-btn');
const resetBtn=document.getElementById('reset-btn');
const refineBar=document.getElementById('refine-bar');
if(tool.kind==='llm')refineBar.style.display='flex';
if(tool.kind==='external'){
  genBtn.addEventListener('click',()=>{window.open(tool.external,'_blank');});
}else{
  genBtn.addEventListener('click',()=>{
    if(tool.fields.some(f=>f.req)){
      const missing=tool.fields.some(f=>f.req&&!document.getElementById(`f-${f.id}`).value.trim());
      if(missing){alert('Please fill in the required fields (marked *).');return;}
    }
    genBtn.textContent='Generating…';genBtn.style.opacity='.7';
    setTimeout(()=>{
      genBtn.textContent='Generate';genBtn.style.opacity='1';
      renderResult(tool.sample);
    },520);
  });
}
resetBtn.addEventListener('click',()=>{
  document.querySelectorAll('#fields input,#fields select,#fields textarea').forEach(el=>{el.value=el.defaultValue||'';});
  document.getElementById('result').classList.remove('show');
});
document.getElementById('refine-btn').addEventListener('click',()=>{
  const inp=document.getElementById('refine-in');
  if(!inp.value.trim())return;
  inp.value='';alert('Output refined — updated based on your instruction.');
});
/* cwv counter */
const urlCount=document.getElementById('url-count');
if(slug==='cwv-batch'){
  const ta=document.getElementById('f-urls');
  const upd=()=>{const n=ta.value.split('\n').filter(x=>x.trim()).length;urlCount.innerHTML=`<b>${n}</b>/10 URLs`;if(n>=10)ta.style.borderColor='oklch(0.72 0.15 75)';};
  ta.addEventListener('input',upd);upd();
}
/* ---------- result renderer ---------- */
function statsGrid(s){
  return `<div class="res-grid">${s.map(x=>`<div class="rstat"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')}</div>`;
}
function renderResult(s){
  const rb=document.getElementById('res-body');
  const cost=document.getElementById('res-cost');
  document.getElementById('res-title').textContent=s.title;
  cost.textContent= tool.kind==='llm'?`US$${(Math.random()*4+0.4).toFixed(2)}`:'';
  let html=statsGrid(s.stats||[]);
  if(s.type==='deck'){
    html+=`<div class="slides">${s.slides.map(sl=>`<div class="slide"><div class="sh"><span>${sl.t}</span><span>${sl.b.length} pts</span></div><div class="sb"><ul>${sl.b.map(b=>`<li>${b}</li>`).join('')}</ul></div></div>`).join('')}</div>`;
  }
  if(s.type==='sections'){
    html+=s.sections.map(sc=>`<div class="secblock"><h4>${sc.h}</h4>${sc.p?`<p>${sc.p}</p>`:''}${sc.ul?`<ul>${sc.ul.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`).join('');
  }
  if(s.type==='brief'){
    if(s.findings)html+=`<div class="secblock"><h4>Key findings</h4>${s.findings.map(f=>`<p><b>${f.k}:</b> ${f.v}</p>`).join('')}</div>`;
    if(s.talk)html+=`<div class="secblock"><h4>Talking points</h4><ul>${s.talk.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
    if(s.rec)html+=`<div class="secblock"><h4>Recommendations</h4><ul>${s.rec.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
    if(s.outline)html+=`<div class="secblock"><h4>Outline</h4><ul>${s.outline.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
    if(s.faqs)html+=`<div class="secblock"><h4>FAQ ideas</h4><ul>${s.faqs.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  }
  if(s.type==='code'){
    html+=`<pre class="code">${s.code}</pre>`;
  }
  if(s.scores){
    html+=`<div class="scores">${s.scores.map(sc=>`<div class="score"><div class="ttl"><span>${sc.k}</span><span class="v">${sc.v}</span></div><div class="tr"><div class="fl" style="width:${sc.v}%;background:${sc.color}"></div></div></div>`).join('')}</div>`;
  }
  if(s.table){
    html+=`<table><thead><tr>${s.table.head.map(h=>`<th class="${['Impr.','Clicks','CTR','Pos.','Volume','Position','Contacts','Cost (US$)','Runs','Score'].includes(h)?'num':''}">${h}</th>`).join('')}</tr></thead><tbody>${s.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${s.table.head[i]&&['Impr.','Clicks','CTR','Pos.','Volume','Position','Contacts','Cost (US$)','Runs','Score'].includes(s.table.head[i])?'num':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  html+=`<div class="note-bar">Prototype output — shows the shape of a live ${tool.name} result. In production this comes from the ${tool.kind==='llm'?'LLM pipeline (deepseek-v4-flash) with ${tool.name==='Pitch Deck Generator'||tool.name==='Proposal Generator'?'HubSpot lead import':'live GA4 / GSC / PSI / Ahrefs data'}':'live tool API'}.</div>`;
  rb.innerHTML=html;
  document.getElementById('result').classList.add('show');
  historyCount++;
  const hist=document.getElementById('history');
  const li=document.createElement('li');
  const who=document.getElementById('f-clientName')?.value||document.getElementById('f-clientWebsite')?.value||document.getElementById('f-domain')?.value||document.getElementById('f-keyword')?.value||'—';
  li.innerHTML=`<span class="dot"></span><span class="who"><b>${who||'Untitled run'}</b><span>${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${tool.name}</span></span><span class="cost">${tool.kind==='llm'?'$'+ (Math.random()*4+0.4).toFixed(2):''}</span>`;
  li.addEventListener('click',()=>renderResult(tool.sample));
  hist.prepend(li);
  const empty=hist.querySelector('.empty-rail');if(empty)empty.remove();
}
